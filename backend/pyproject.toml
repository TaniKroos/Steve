# backend: the public API service the frontend talks to.
[project]
name = "cloudagent-backend"
version = "0.1.0"
description = "Public REST + SSE API that the CloudAgent frontend talks to."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "redis>=5.0.4",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    # Starlette's signed-cookie SessionMiddleware (what we use for login
    # state, per the "signed httpOnly cookie" decision) needs this to sign
    # the cookie payload.
    "itsdangerous>=2.2.0",
    # Official E2B SDK -- SandboxOrchestrator calls this directly to
    # create/delete sandboxes (management-plane only; see
    # services/sandbox_orchestrator.py). Verify exact method
    # names/signatures against current E2B docs before relying on this in
    # anything beyond local scaffolding -- SDK APIs move.
    "e2b>=1.0.0",
    # The shared package -- see [tool.uv.sources] below for how uv
    # resolves this to the local cloudagent_core/ directory instead of
    # trying to fetch it from PyPI.
    "cloudagent-core",
]

# This is the actual "monorepo dependency" wiring: without this,
# `cloudagent-core` in the dependency list above would just be a normal
# PyPI package name (and fail to resolve, since it's not published).
# `workspace = true` tells uv "this dependency is another member of the
# same workspace -- install it editable, from ../cloudagent_core".
[tool.uv.sources]
cloudagent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
