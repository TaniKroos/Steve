# agent_loop: the service that actually drives a session -- connects to
# its sandbox, runs the LLM tool-calling loop, persists every turn, and
# opens the PR. See claude/agent-loop-plan.md for the full design.
[project]
name = "cloudagent-agent-loop"
version = "0.1.0"
description = "Runs the per-session LLM tool-calling loop against a sandbox and pushes the resulting PR."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "redis>=5.0.4",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    # Official E2B SDK -- e2b_sandbox.py is the only file in this service
    # that imports it directly (SandboxPort keeps the rest of the app
    # from needing to know E2B's SDK shape at all).
    "e2b>=1.0.0",
    # Anthropic's official SDK -- AnthropicClient(LLMPort).
    "anthropic>=0.40.0",
    # LlamaClient(LLMPort) talks to any OpenAI-compatible endpoint
    # (Together/Groq/Fireworks) via the official openai SDK rather than
    # hand-rolled httpx -- same wire format, better-maintained client.
    "openai>=1.50.0",
    "cloudagent-core",
]

[tool.uv.sources]
cloudagent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
