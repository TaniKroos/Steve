# cloudagent_core: the shared package. Both `backend` and (later)
# `agent_loop` install this as a real dependency (see the workspace root
# pyproject.toml and backend/pyproject.toml's [tool.uv.sources]).
#
# What lives here and why: only things that MUST be identical across both
# services -- the database schema (SQLAlchemy models + Alembic
# migrations) and GitHub App auth logic (JWT signing, token minting).
# Everything else (routers, business logic, HTTP concerns) stays in the
# service that owns it.
[project]
name = "cloudagent-core"
version = "0.1.0"
description = "Shared DB models, settings, and GitHub App auth logic used by both the backend API and the agent loop service."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudagent_core"]
