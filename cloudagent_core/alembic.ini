; Alembic config. Note there's no `sqlalchemy.url` here -- deliberately.
; alembic/env.py reads DATABASE_URL from the environment at runtime
; instead, via cloudagent_core.settings.CoreSettings, so the exact same
; config file works against local Docker Postgres, a staging DB, or
; production without editing this file or committing a connection string.

[alembic]
; %(here)s resolves to this ini file's own directory, so `alembic` commands
; work the same whether run from repo root (`-c cloudagent_core/alembic.ini`)
; or from inside cloudagent_core/ directly.
script_location = %(here)s/alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
